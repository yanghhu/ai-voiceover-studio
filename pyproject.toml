[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voiceover-studio"
version = "0.3.0"
description = "Open-source AI voiceover and faceless video generator: turn a script into text-to-speech narration, SRT subtitles and YouTube / Shorts / TikTok videos with word-by-word captions. Free voices, no API key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Miragea contributors" }]
keywords = [
  "ai voiceover",
  "text to speech",
  "tts",
  "text to video",
  "faceless youtube",
  "faceless video generator",
  "youtube shorts",
  "tiktok captions",
  "word-by-word subtitles",
  "animated captions",
  "subtitles",
  "srt",
  "voice cloning",
  "dubbing",
  "narration",
  "edge-tts",
  "video automation",
  "ai video generator",
  "ffmpeg",
  "python cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: Japanese",
  "Natural Language :: Spanish",
]
dependencies = []

[project.optional-dependencies]
edge = ["edge-tts>=6.1.10"]
# Video is rendered with ffmpeg directly; the extra is kept so `[video]` installs keep working.
video = []
yaml = ["PyYAML>=5.4"]
all = ["edge-tts>=6.1.10", "PyYAML>=5.4"]
dev = ["pytest>=7"]

[project.scripts]
voiceover = "voiceover_studio.cli:main"

[project.urls]
Homepage = "https://github.com/yanghhu/ai-voiceover-studio"
Documentation = "https://github.com/yanghhu/ai-voiceover-studio#readme"
FAQ = "https://github.com/yanghhu/ai-voiceover-studio/blob/main/docs/FAQ.md"
Source = "https://github.com/yanghhu/ai-voiceover-studio"
Issues = "https://github.com/yanghhu/ai-voiceover-studio/issues"
Changelog = "https://github.com/yanghhu/ai-voiceover-studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

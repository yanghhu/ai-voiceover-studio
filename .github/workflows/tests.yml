name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04        # newest runner image that still ships Python 3.9
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,edge,yaml]"
      - run: pytest
      - name: Doctor
        run: voiceover doctor
      - name: Dry run (offline dummy provider)
        run: voiceover script examples/script.md --dry-run -o out/ --name voiceover.wav
      - name: Dry-run video (ffmpeg, captions, Ken Burns)
        run: voiceover video --dry-run --images examples/slides --script examples/script.md -o out/video.mp4 --size 640x360 --fps 15
